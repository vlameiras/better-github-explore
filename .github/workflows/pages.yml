name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *' # daily feed, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v5
      # The feed visitors see first: the repo owner's public stars, scanned ahead of time.
      # If the scan fails, keep the feed that is live now rather than deploying without one.
      - name: Build the daily feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DAILY_LOGIN: ${{ github.repository_owner }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          node scripts/build-daily.mjs "$DAILY_LOGIN" public/daily.json \
            || curl -fsSL "$PAGES_URL/daily.json" -o public/daily.json \
            || echo "::warning::No daily feed in this deploy"
      # public/ is the whole site; the server is only for local mode.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
